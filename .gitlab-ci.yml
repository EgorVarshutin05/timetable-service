# Эквивалент .github/workflows/ci.yml для GitLab: lint + typecheck + test.
image: ghcr.io/astral-sh/uv:0.13-python3.12-trixie-slim

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

cache:
  key: uv-$CI_COMMIT_REF_SLUG
  paths:
    - .uv-cache

stages:
  - lint
  - check

check:
  stage: check
  before_script:
    - uv sync --locked
  script:
    # just ставится из PyPI (пакет rust-just) тем же uv.
    - uvx --from rust-just just check

# История коммитов по CONTRIBUTING.md. GIT_DEPTH: 0 отключает shallow clone; ветки change/* и теги
# дотягиваются явно, иначе проверка принадлежности второго родителя ветке даст предупреждение.
# Образ не slim: нужен git.
lint-commits:
  stage: lint
  image: python:3.12-trixie
  cache: []
  variables:
    GIT_DEPTH: 0
  script:
    - git fetch --quiet origin 'refs/tags/*:refs/tags/*' '+refs/heads/change/*:refs/remotes/origin/change/*'
    - python3 tools/lint_commits.py --base scaffold-base --head HEAD --strict
